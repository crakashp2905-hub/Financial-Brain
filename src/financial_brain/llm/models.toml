# Model registry (ADR-0002). Tier 0 is not here: deterministic code needs no model.
#
#   tier 1  tiny specialists (<= 3B)        local, free, high volume
#   tier 2  local general 7-14B             local, free, slow on this CPU
#   tier 3  cheap cloud                     paid, gated (FB_LLM_ENABLED=1)
#   tier 4  frontier                        paid, gated, only for hard problems
#
# A model is *eligible* for a task only after `fb models bench` has measured it on that
# task's labelled set and it cleared the task's bar. Reputation is not a qualification.
# Prices are USD per million tokens (input, output); local models cost 0.
# system_one = false marks reasoning-only models: they think before any answer, so they
# cannot give a one-token typed decision (minutes per item on this CPU). They are for
# rare hard questions, never for bulk classification, and the benchmark skips them.

[[model]]
name = "qwen2.5:1.5b"
backend = "ollama"
tier = 1
role = "cheap typed decisions"

[[model]]
name = "qwen2.5:3b"
backend = "ollama"
tier = 1
role = "cheap typed decisions"

[[model]]
name = "llama3.2:3b"
backend = "ollama"
tier = 1
role = "cheap typed decisions"

[[model]]
name = "finsenti-llama3.2-1b"
backend = "ollama"
tier = 1
answer_style = "words"            # fine-tuned to answer the label word, not a letter
role = "financial sentiment specialist (FinSenti, Apache-2.0)"

[[model]]
name = "nomic-embed-text:latest"
backend = "ollama"
tier = 1
system_one = false
role = "embeddings for retrieval (not a classifier)"

[[model]]
name = "llama-guard3:1b"
backend = "ollama"
tier = 1
role = "safety classification only (prompt/response moderation)"

[[model]]
name = "qwen2.5:7b"
backend = "ollama"
tier = 2
role = "classification, extraction, short summaries"

[[model]]
name = "llama3.1:8b"
backend = "ollama"
tier = 2
role = "classification, extraction"

[[model]]
name = "gemma2:latest"
backend = "ollama"
tier = 2
role = "classification, summaries"

[[model]]
name = "phi4:latest"
backend = "ollama"
tier = 2
role = "reasoning over supplied facts"

[[model]]
name = "deepseek-r1:14b"
backend = "ollama"
tier = 2
system_one = false
role = "step-by-step reasoning (slow: emits long thinking)"

[[model]]
name = "qwen3:4b"
backend = "ollama"
tier = 2
system_one = false
role = "reasoning; always thinks first (ignores think=false and /no_think)"

[[model]]
name = "fin-r1"
backend = "ollama"
tier = 2
# Measured 2026-09-20: forced to one token it answers on-menu in ~2.4 s, so it *can*
# serve System One despite being an R1-style distill. Benchmarked like any other.
system_one = true
role = "financial reasoning (Fin-R1 7B, SUFE; licence unverified - personal use)"

# Laya (Convai Innovations, Apache-2.0) - non-autoregressive typed decisions. An
# encoder, so there is no continuation for untrusted filing text to hijack, and one
# forward pass instead of 2.4 s of generation. Its own README says both checkpoints
# ship over-confident (mean ECE 0.466, and 0.081 after refitting temperature on held-out
# data), which is the same lesson this project learned when an 89.1% in-sample threshold
# became 65.4% held out. Candidates until `fb models bench` says otherwise.
[[model]]
name = "laya"
backend = "laya"
tier = 1
system_one = true
repo = "convaiinnovations/laya"
role = "typed decisions in one forward pass (ModernBERT-large 421M, English)"

[[model]]
name = "laya-multilingual"
backend = "laya"
tier = 1
system_one = true
repo = "convaiinnovations/laya"
subfolder = "multilingual"
role = "typed decisions, 100+ languages (mmBERT-base 322M)"

[[model]]
name = "claude-haiku-4-5"
backend = "anthropic"
tier = 3
price_in = 1.0
price_out = 5.0
role = "cheap cloud: large documents, moderate reasoning"

[[model]]
name = "claude-opus-5"
backend = "anthropic"
tier = 4
price_in = 5.0
price_out = 25.0
role = "frontier: deep research, synthesis, committee chair"
