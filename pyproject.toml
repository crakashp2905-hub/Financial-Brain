[project]
name = "financial-brain"
version = "0.1.0"
description = "An AI-native financial research system for Indian markets"
requires-python = ">=3.11"
# pytz: DuckDB needs it for TIMESTAMPTZ <-> Python conversion. numpy/pandas/scipy/scikit-learn: the evaluation,
# opportunity, portfolio and regime modules import them at module level, so they are core, not optional.
dependencies = ["duckdb>=1.0", "pytz>=2024.1", "numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3",
                "pyarrow>=14"]   # pyarrow: pandas parquet I/O (cached panels, edge series)

[project.optional-dependencies]
# Reading results/filing PDFs (docintel/). Needed for the as-reported financials store.
docs = ["pypdf>=4.0"]
# Everything the test suite imports. `pip install -e .[dev]` must be enough to run all of it; the only tests that
# skip are the torch learners (a separate, large install: the `forecasting` extra).
dev = ["pytest>=8.0", "coverage>=7.0", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7", "pypdf>=4.0", "pymupdf>=1.24", "lightgbm>=4.0"]
# Local tier-1 encoders (FinBERT via ONNX; no PyTorch). Ollama serves the GGUF models.
models = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.26"]
# The HTTP surface in api/. Optional on purpose: a research system should not need a web
# framework to run a backtest, and the core install stays duckdb + pytz.
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
# Local, read-only MCP stdio server. Both the installed v1 maintenance SDK and v2
# expose tool/resource decorators; imports are selected at runtime.
mcp = ["mcp>=1.26,<3"]
# Foundation-model forecasting. Optional for the same reason as `api`: the nulls, the scores and the
# walk-forward harness in forecasting/ are pure Python and run on the core install, so a bootstrap
# baseline can be established without torch. Kronos itself is a repository rather than a
# distribution - clone https://github.com/shiyu-coder/Kronos onto sys.path - and its weights are a
# separate download from Hugging Face.
forecasting = ["torch>=2.2", "pandas>=2.0", "einops>=0.7", "huggingface-hub>=0.23",
               "safetensors>=0.4"]

[project.scripts]
fb = "financial_brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"financial_brain.agents" = ["eval_cases.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# Gated in CI: the modules where a type error can send, size or judge an order. Widened as modules are cleaned.
files = ["src/financial_brain/execution/oms", "src/financial_brain/evaluation/standard.py",
         "src/financial_brain/research/preregistry.py"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff]
line-length = 92
target-version = "py313"

[tool.ruff.lint]
# Rules that catch real defects, not style opinions. F821 is here because a call to an
# undefined name (a daily step using `db` where none was bound) passed tests for days:
# every step is wrapped in try/except, so the NameError read as a step "failing".
select = ["F", "E9", "B"]
# B905 (zip without strict=) is off by default here because most zips in this codebase
# pair a row with its own fields. Where a length mismatch would corrupt a *result* -
# the model scorer pairing decisions with gold labels - strict=True is written
# explicitly instead.
ignore = ["B008", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
