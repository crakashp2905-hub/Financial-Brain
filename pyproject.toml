[project]
name = "financial-brain"
version = "0.1.0"
description = "An AI-native financial research system for Indian markets"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "pytz>=2024.1"]  # pytz: DuckDB needs it for TIMESTAMPTZ <-> Python conversion

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fb = "financial_brain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
