name = "Disclosed insider and substantial-acquisition activity, 60 sessions"
signal = "insider_60d"
direction = 1
horizon = 20
positions = 40
aum_inr = 10_000_000
rationale = """
The defensible version of "follow what informed people do": SEBI requires insiders and
substantial acquirers to disclose their dealings, and those filings are in the archive
(68,802 insider disclosures, 105,257 substantial acquisitions). Insider purchases
predicting returns is among the better-replicated results in the literature (Lakonishok &
Lee 2001; Jeng, Metrick & Zeckhauser 2003), usually strongest in smaller names.

Known weakness, stated before testing: this counts disclosures without reading their
direction. A pledge release, a sale and a purchase all count the same, so the signal is
blunt by construction. If it fails, the next version parses the direction out of the
filing rather than abandoning the idea.
"""

# 2026-09-22, after the fact. This trial is VOID, not merely rejected.
#
# `insider_60d` no longer exists. Counting what it had contained showed 30.6% quarterly
# compliance certificates reporting no dealing at all, plus 6.1% from a regulatory regime
# that ended in 2015 with 10,399 of its 10,617 filings in that single year. The rule
# matching `reg 7(` had swallowed the certificates that the PIT regulations happen to
# number 7(3).
#
# So t = -0.35 measured a feature that did not contain insider trades. It is left here
# unedited, because a pre-registration that gets rewritten after the result is not a
# pre-registration. The corrected population is tested as h8 on `dealing_60d`, and that
# is counted as a separate trial.
