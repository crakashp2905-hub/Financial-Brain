# Every push and pull request: the full suite on a clean Windows and Linux install from pyproject alone, plus lint,
# type checks on the critical modules, a dependency audit and the schema migration tests.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the pre-registration audit reads git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (pyproject only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Validate capability claims
        run: python scripts/validate_capability_matrix.py
      - name: Inventory source ownership gaps
        run: python scripts/source_inventory.py
      - name: Type check (OMS, evidence standard, pre-registry)
        run: python -m mypy
      - name: Schema migrations
        run: python -m pytest -q tests/test_migrations.py
      - name: Algorithm status file is current and algorithm tests
        run: python scripts/algo_progress.py --check
      - name: Chart-pattern completion matrix is current
        run: python scripts/chart_patterns_matrix.py --check
      - name: Chart-pattern offline demo (network denied)
        run: python -m financial_brain.patterns.demo --offline
      - name: Chart-pattern completion matrix is current
        run: python scripts/chart_patterns_matrix.py --check
      - name: Chart-pattern offline demo (network denied)
        run: python -m financial_brain.patterns.demo --offline
      - name: Test suite
        run: python -m coverage run --source=financial_brain -m pytest -q
      - name: Critical-module coverage
        run: python -m coverage report --include="*/execution/oms/*,*/risk/*,*/evaluation/champion.py,*/evaluation/prospective.py,*/decisions/net_alpha.py,*/interfaces/*"
      - name: Chart-pattern package coverage floor
        run: python -m coverage report --include="*/patterns/*" --fail-under=85
      - name: Coverage XML
        run: python -m coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: Lockfile audit
        run: python -m pip_audit -r requirements-lock.txt

  # The pinned environment the owner actually runs: install exactly requirements-lock.txt and run the suite. Not a required
  # check (a pin a platform cannot install should be visible, not block unrelated work), but it must stay green.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the lockfile exactly
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Test suite on the pinned environment
        run: python -m pytest -q
