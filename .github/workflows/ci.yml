# Every push and pull request: the full suite on a clean Windows and Linux install from pyproject alone, plus lint,
# type checks on the critical modules, a dependency audit and the schema migration tests.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the pre-registration audit reads git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Charting adapter contracts (no licensed assets)
        run: node --test tests/js/advanced_charts_datafeed.test.mjs tests/js/advanced_charts_widget.test.mjs
      - name: Install (pyproject only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check (OMS, evidence standard, pre-registry)
        run: python -m mypy
      - name: Schema migrations
        run: python -m pytest -q tests/test_migrations.py
      - name: Test suite
        run: python -m coverage run --source=financial_brain -m pytest -q
      - name: Critical-module coverage
        run: python -m coverage report --include="*/execution/oms/*,*/risk/*,*/evaluation/champion.py,*/evaluation/prospective.py,*/decisions/net_alpha.py,*/interfaces/*"
      - name: Coverage XML
        run: python -m coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
