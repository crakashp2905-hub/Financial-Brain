# Every push and pull request: the full suite on clean, pinned Windows and Linux installs, plus lint,
# type checks on the critical modules, a dependency audit and the schema migration tests.
name: ci
on:
  push:
  pull_request:

env:
  TZ: UTC
  PYTHONHASHSEED: "20261112"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the pre-registration audit reads git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Validate direct dependencies are pinned
        run: python scripts/validate_requirements_lock.py
      - name: Install pinned full-test environment
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.46.2
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[dev]" --no-deps --no-build-isolation
          python -m pip check
      - name: Lint
        run: python -m ruff check src tests
      - name: Verify explicit CI quality matrix and unique chart-pattern gates
        run: python scripts/validate_ci_matrix.py
      - name: Validate capability claims
        run: python scripts/validate_capability_matrix.py
      - name: Verify forward-edge capability matrix rendering
        run: python scripts/forward_edge_capability_matrix.py --check
      - name: Validate market-data source rights and credential inventory
        run: python scripts/validate_market_data_sources.py
      - name: Validate independent release semantics
        run: python scripts/validate_release_semantics.py
      - name: Inventory source ownership gaps
        run: python scripts/source_inventory.py
      - name: Verify source inventory snapshot
        run: python scripts/source_inventory.py --output docs/edge-program/source-inventory.v2.json --check
      - name: Verify trader capability owners
        run: python scripts/capability_ownership.py --check
      - name: Validate five-desk product charter
        run: python scripts/validate_product_charter.py --check
      - name: Validate five-desk launch gates and evidence labels
        run: python scripts/validate_launch_gates.py --check
      - name: Verify complete per-item checklist audit export
        run: python scripts/export_checklist_audit.py --check
      - name: Verify evidence-derived profit readiness report
        run: python scripts/profit_readiness.py --check
      - name: Verify old/new forward-engine dependency graph
        run: python scripts/forward_engine_graph.py --check
      - name: Verify current checklist PR dependency and overlap snapshot
        run: python scripts/validate_pr_dependency_snapshot.py
      - name: Verify canonical PR merge sequence
        run: python scripts/validate_merge_sequence.py
      - name: Verify PR 40 to main public-contract reconciliation
        run: python scripts/validate_pr40_main_contract_reconciliation.py
      - name: Verify v1.4 checklist traceability index
        run: python scripts/validate_v1_4_traceability_index.py
      - name: Verify frozen historical research result notes
        run: python scripts/research_outcome_freeze.py --check
      - name: Verify historical search-space reconciliation
        run: python scripts/validate_research_search_space.py
      - name: Verify exact capability source and PR provenance
        run: python scripts/capability_provenance.py --check
      - name: Verify domain entry-point inventory and authority bindings
        run: python scripts/entrypoint_inventory.py --check
      - name: Verify fixed-fixture legacy/integrated paper equivalence report
        run: python scripts/forward_edge_equivalence_report.py --check
      - name: Verify CODEOWNERS domain coverage
        run: python scripts/validate_codeowners_map.py
      - name: Verify historical reference-strategy pins
        run: python scripts/validate_reference_candidates.py
      - name: Verify reproducible checklist evidence bundle
        run: python scripts/build_checklist_evidence_bundle.py --check
      - name: Verify scoped authoritative state ownership
        run: python scripts/state_ownership.py
      - name: Verify protected-trial program windows and budgets
        run: python scripts/validate_trial_program.py
      - name: Verify protected-trial byte preservation audit
        run: python scripts/trial_preservation_audit.py --check
      - name: Validate protocol deviation register
        run: python scripts/validate_deviation_log.py
      - name: Type check (OMS, evidence standard, pre-registry)
        run: python -m mypy
      - name: Schema migrations
        run: python -m pytest -q tests/test_migrations.py
      - name: Algorithm status file is current and algorithm tests
        run: python scripts/algo_progress.py --check
      - name: Chart-pattern completion matrix is current
        run: python scripts/chart_patterns_matrix.py --check
      - name: Chart-pattern offline demo (network denied)
        run: python -m financial_brain.patterns.demo --offline
      - name: Test suite
        run: python -m coverage run --source=financial_brain -m pytest -q -ra --junitxml=pytest-results.xml
      - name: Summarize test and skip counts
        if: always() && hashFiles('pytest-results.xml') != ''
        run: python scripts/ci_test_summary.py pytest-results.xml
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}
          path: pytest-results.xml
          if-no-files-found: warn
      - name: Critical-module coverage
        run: python -m coverage report --show-missing --include="*/execution/oms/*,*/risk/*,*/evaluation/champion.py,*/evaluation/learners.py,*/evaluation/learned_model.py,*/evaluation/prospective.py,*/decisions/net_alpha.py,*/interfaces/*,*/opportunity/learning.py"
      - name: Enforce per-service coverage floors
        run: |
          python -m coverage json --include="*/execution/oms/*,*/risk/*,*/evaluation/champion.py,*/evaluation/learners.py,*/evaluation/learned_model.py,*/evaluation/prospective.py,*/decisions/net_alpha.py,*/interfaces/*,*/opportunity/learning.py" -o critical-coverage.json
          python scripts/check_critical_coverage.py critical-coverage.json
      - name: Chart-pattern package coverage floor
        run: python -m coverage report --include="*/patterns/*" --fail-under=85
      - name: Coverage XML
        run: python -m coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            critical-coverage.json
      - name: Dependency audit
        run: python -m pip_audit --skip-editable

  reproducibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Validate direct dependencies are pinned
        run: python scripts/validate_requirements_lock.py
      - name: Install pinned build tools and locked environment
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.46.2
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Check locked environment
        run: python -m pip check
      - name: Verify Python, timezone, seed, lock, and fixture fingerprints
        run: python scripts/verify_reproducibility.py
      - name: Verify deterministic fixture behavior without market access
        run: python -m pytest -q tests/test_forward_edge_cli.py::test_fixture_pack_is_deterministic_and_costs_are_net_of_pnl

  forecasting-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-forecasting-lock.txt
      - name: Validate direct dependencies are pinned
        run: python scripts/validate_requirements_lock.py
      - name: Install pinned full-test environment
        run: |
          python -m pip install --upgrade pip==26.2 setuptools==84.1.0 wheel==0.46.2
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[dev]" --no-deps --no-build-isolation
      - name: Install pinned CPU forecasting environment
        run: |
          python -m pip install -r requirements-forecasting-lock.txt
          python -m pip check
      - name: Exercise optional LSTM learner with coverage
        run: |
          python -m coverage run --source=financial_brain.evaluation.learners -m pytest tests/test_phase5_learners.py -q
          python -m coverage report --show-missing --include="*/evaluation/learners.py" --fail-under=90
      - name: Audit forecasting dependencies
        run: python -m pip_audit --skip-editable --vulnerability-service osv
